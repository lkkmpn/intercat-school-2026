[project]
name = "ics26"
version = "0.1.0"
description = "InterCat School 2026"
readme = "README.md"
authors = [
    { name = "Luuk Kempen", email = "luuk@phys.au.dk" }
]
requires-python = ">=3.11"
dependencies = [
    "ase>=3.29.0",
    "ipykernel>=6.17.1",
    "ipywidgets>=7.7.1",
    "matplotlib>=3.10.0",
    "numpy>=2.1.3",
]

[project.optional-dependencies]
ml-methods = [
    "colorspacious>=1.1.2",
    "dscribe>=2.1.2",
    "matplotlib-plus-plus>=0.0.1",
    "scikit-learn>=1.6.1",
    "scipy>=1.16.3",
    "torch>=2.8.0",
    "tqdm>=4.67.3",
]
modeling = [
    "mace-torch>=0.3.16",
    "scipy>=1.16.3",
    "sella>=2.6.0",
    "torch>=2.8.0",
]
all = ["ics26[ml-methods,modeling]"]

[dependency-groups]
internal = [
    "fairchem-core",
    "jupyterlab>=4.6.4",
    "torch<2.11",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
conflicts = [
    [
        { extra = "modeling" },
        { group = "internal" },
    ]
]

[tool.uv.sources]
matplotlib-plus-plus = { git = "https://gitlab.com/lkkmpn/mplpp.git" }
