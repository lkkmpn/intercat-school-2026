[project]
name = "ics26"
version = "0.1.0"
description = "InterCat School 2026"
readme = "README.md"
authors = [
    { name = "Luuk Kempen", email = "luuk@phys.au.dk" }
]
requires-python = ">=3.11"
dependencies = [
    "ase>=3.29.0",
    "ipykernel>=7.4.0",
    "ipywidgets>=8.1.9",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
]

[project.optional-dependencies]
ml-methods = [
    "colorspacious>=1.1.2",
    "dscribe>=2.1.2",
    "matplotlib-plus-plus>=0.0.1",
    "scikit-learn>=1.9.1",
    "scipy>=1.17.1",
    "torch>=2.8.0",
    "tqdm>=4.70.1",
]

[dependency-groups]
internal = [
    "fairchem-core",
    "torch<2.11",
]

[build-system]
requires = ["uv_build>=0.9.2,<0.10.0"]
build-backend = "uv_build"

[tool.uv.sources]
matplotlib-plus-plus = { git = "https://gitlab.com/lkkmpn/mplpp.git" }
